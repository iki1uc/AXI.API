<style>

<body data-gate="ROOT" data-wloch="H2O" data-whirl="O2" data-rom="81" data-build="360" data-atom="H2O-O2-CO2" data-respo="">
<h1>api.axi ↔ AXI.API — gleicher Index, zwei Namen — ANKER A01</h1>
<p style="margin:8px 0;color:#666">AXI.API = AXI als API · api.axi = API als AXI · STABIL 100%</p>
<div class="box" id="board"></div>
<div class="box" id="signal"></div>
<div class="box" id="respo"></div>
<div class="box" id="geo"></div>
<div class="box" id="api"></div>
<script>
// ANKER A01 — me.html = ANKER A01 S01 D4 erabel STABIL 100%
window.ANKER = {
  signal: "A01 S01 D4 erabel STABIL 100% - VESTA 300k - ATOM H2O/O2/CO2",
  id:"A01", station:"S01", dim:"D4", modus:"erabel",
  rolle:"Stabilisationsachse IQ QI EVO UPD UPG BIOS CALC",
  bindungen:"AXI|6d|360|100|213 REAL|API",
  state:"STABIL", vesta:"300k", rom:"81"
};
// T.init — axi.ApiPpi.html 360 Vollrotation
window.T = {
  init: (folder) => {
    const log = \`[T.init] 360° Vollrotation → \${folder} — ANKER \${window.ANKER.id} STABIL\`;
    console.log(log);
    const el = document.getElementById('geo');
    if(el) el.textContent += "\\n" + log;
    return { folder, anker: window.ANKER.id, rotation: 360, status:"locked" };
  }
};
// ID_KOOP — eTEAM.html Team koop legitimation
window.ID_KOOP = {
  id:"KOOP", vesta:"300k", rom:"81", atom:"H2O/O2/CO2", ready:"729",
  info: () => "KOOP: Zusammenarbeit - VESTA 300k - ROM 81 - 729 ready - ATOM: H2O/O2/CO2"
};
window.ID_NEUTRAL = { id:"NEUTRAL", info: () => "NEUTRAL: Standby - kein Eingriff" };
window.ID_POOK = { id:"POOK", blocked:true, info: () => "POOK: BLOCKED — nicht legitimiert" };
// RESPO — continium.js Zug zur Aufgabe + respo.js
window.RESPO = {
  lol: () => "RESPO.lol() → \uD83D\uDE06 aber STABIL",
  check: (axes) => {
    const state = { axes, ts: Date.now(), gate: axes.gate, build: 360 };
    const chain = {
      _s: state,
      whirl(v){ this._s.whirl=v; return this; },
      nc(v){ this._s.nc=v; return this; },
      uni(v){ this._s.uni=v; return this; },
      da(v){ this._s.da=v; return this; },
      welt(v){ this._s.welt=v; return this; },
      exo(v){ this._s.exo=v; return this; },
      cosmos(v){ this._s.cosmos=v; return this; },
      atom(v){ this._s.atom=v; this._s.atom_chain=v; return this; },
      value(){ return this._s; },
      toJSON(){ return this._s; }
    };
    return chain;
  },
  whirl: () => "O2-Wirbel aktiv",
  nc: () => "NC9x9 Grid locked",
  uni: () => "UNI bridge",
  da: () => "DA matrix",
  welt: () => "WELT core",
  exo: () => "EXO scan",
  cosmos: () => "COSMOS sync",
  atom: () => "H2O→O2→CO2"
};
(function(){
  const b = document.body.dataset;
  const axes = {
    gate: b.gate, wloch: b.wloch, whirl: b.whirl, rom: b.rom,
    continium: "Zug zur Aufgabe", uni: "bridge", da:"matrix", welt:"core",
    anker: window.ANKER.id, atom: b.atom
  };
  const respoState = window.RESPO.check(axes)
    .whirl("active").nc("NC9x9").uni("bridge").da("matrix")
    .welt("core").exo("scan").cosmos("sync").atom("H2O→O2→CO2")
    .value();
  document.body.dataset.respo = JSON.stringify(respoState);
  // me.html displays
  document.getElementById('board').textContent =
    "[#board ANKER]\\n" + window.ANKER.signal + "\\nID:" + window.ANKER.id +
    " ST:" + window.ANKER.station + " D:" + window.ANKER.dim +
    "\\nROLLE:" + window.ANKER.rolle + "\\nBIND:" + window.ANKER.bindungen;
  document.getElementById('signal').textContent =
    "[#signal]\\n" + window.ANKER.signal + "\\nSTATE:" + window.ANKER.state + " 100%";
  document.getElementById('respo').textContent =
    "[#respo]\\n" + JSON.stringify(respoState,null,2);
  document.getElementById('geo').textContent =
    "[#geo]\\nGATE:" + axes.gate + " WLOCH:" + axes.wloch + " WHIRL:" + axes.whirl +
    " ROM:" + axes.rom + " BUILD:" + b.build + "\\nATOM:" + axes.atom;
  document.getElementById('api').textContent =
    "[#api]\\nGET /api/axi?gate=ROOT&wloch=H2O → " + JSON.stringify(respoState).slice(0,120) + "...\\n" +
    "/api/axi/anchor → ANKER\\n/api/axi/koop → ID_KOOP.info()";
  // 360 Vollrotation folder detection
  const folder = location.pathname.split('/').filter(Boolean).pop() || "ROOT";
  window.T.init(folder);
})();
